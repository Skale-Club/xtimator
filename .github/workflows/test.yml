name: Test

# TEST gate only (EVAL-04) — NOT a deploy change.
# Deploy lives entirely in build-deploy.yml: `next build` runs in Docker on a
# GitHub runner, the image is pushed to GHCR, and Coolify PULLs it. This
# workflow NEVER builds the app, builds no image, and touches no deploy path.
# It runs a scoped typecheck + the unit/eval suite (twice, for determinism) and
# fails the build the moment a quality metric, schema validity, or engine
# behavior regresses.
#
# Secret-free by construction: the eval harness mocks every provider
# (getAIProviderWithFallback + transcribeAudioOR/analyzePhotoOR) and the
# Supabase service client, so NO AI keys and NO Supabase keys are required.
# tests/integration/** (which needs a live Supabase) is intentionally EXCLUDED
# from the gate so it stays secret-free.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Typecheck + unit/eval suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24 # matches .nvmrc and the local dev node
          cache: npm

      # Use `npm install` (not `npm ci`) on purpose — same as the Dockerfile.
      # Several deps ship a platform-specific WASM subtree (@emnapi/*) that is
      # NOT in the committed lock file (it resolves per-platform), so strict
      # `npm ci` fails on linux with "Missing @emnapi/runtime from lock file".
      # `npm install` reconciles that subtree at install time.
      - run: npm install --no-audit --no-fund

      # Scoped typecheck — app/lib/components/hooks only (tsconfig.ci.json).
      # This is the REAL gate: it covers only code that can actually reach
      # production, so a failure here is always deploy-relevant. It deliberately
      # excludes tests/**, which is exactly why the advisory step below exists.
      - run: npx tsc --noEmit -p tsconfig.ci.json

      # Advisory bare typecheck — the WHOLE repo, tests/** included.
      # NON-BLOCKING BY DESIGN (`continue-on-error: true`). Do NOT promote this
      # to a hard gate: build-deploy.yml triggers on `workflow_run` for this
      # workflow and only builds when `workflow_run.conclusion == 'success'`, so
      # anything that can fail the Test workflow silently blocks EVERY deploy and
      # stops prod from self-healing.
      # What it watches: type drift in tests/** — stale mocks, fixtures missing
      # newly-required fields. That drift is invisible to the scoped gate above
      # and had silently reached 25 errors before quick-260715-aa1 brought bare
      # `tsc --noEmit` to 0 (2026-07-15). Red here means drift to clean up, never
      # a blocked merge.
      - name: Bare typecheck (advisory, non-blocking)
        continue-on-error: true
        run: npx tsc --noEmit

      # Unit + eval suite. tests/integration is EXCLUDED (it needs live
      # Supabase → would break the secret-free gate; research Pitfall 6).
      # tests/eval is collected because 103-02 added tests/eval/**/*.test.ts to
      # the vitest `include` (otherwise this path would silently run zero tests).
      - run: npx vitest run tests/unit tests/eval

      # Determinism gate — the Wave-1 invariant made permanent. A re-emergent
      # cross-file isolation leak fails CI on this identical second pass.
      - run: npx vitest run tests/unit tests/eval
