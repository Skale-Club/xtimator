name: Test

# TEST gate only (EVAL-04) — NOT a deploy change.
# Deploy lives entirely in build-deploy.yml: `next build` runs in Docker on a
# GitHub runner, the image is pushed to GHCR, and Coolify PULLs it. This
# workflow publishes no image and touches no deploy path. Its separate trusted
# development job can compile a production-mode artifact for QA evidence.
# It runs a scoped typecheck + the unit/eval suite (twice, for determinism) and
# fails the build the moment a quality metric, schema validity, or engine
# behavior regresses.
#
# The unit/eval job is secret-free: the eval harness mocks every provider
# (getAIProviderWithFallback + transcribeAudioOR/analyzePhotoOR) and the
# Supabase service client, so NO AI keys and NO Supabase keys are required.
# tests/integration/** remains excluded from that job. A separate isolated
# browser job uses development-only credentials and synthetic providers on dev
# pushes, internal pull requests and explicit feature-branch dispatches. It
# never runs on a main push or changes the production deployment trigger.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      qa:
        description: 'Run the isolated autonomous acceptance campaign (synthetic providers; not public-launch approval)'
        type: boolean
        default: false
      qa_max_failures:
        description: 'Diagnostic failure limit (0 runs the complete matrix; missing cases always block readiness)'
        type: string
        default: '0'
      qa_scenarios:
        description: 'Optional comma-separated QA IDs for a focused diagnostic; omitted mandatory cases remain blocked'
        type: string
        default: ''
      unit_scope:
        description: 'Feature-branch diagnostic only; main and dev always run the full regression'
        type: choice
        options:
          - all
          - generation-credits
          - qa-foundations
          - dependency-lock
        default: all
      verify_build:
        description: 'Compile a production-mode artifact with development resources; never publish or deploy it'
        type: boolean
        default: false
      payment_sandbox:
        description: 'Run the Stripe test-mode ledger cases against the designated development database'
        type: boolean
        default: false
      payment_browser:
        description: 'With payment_sandbox, also complete a hosted Stripe Checkout with a test card'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.qa && !inputs.payment_sandbox && inputs.unit_scope != 'dependency-lock' || github.ref_type != 'branch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
    name: Typecheck + unit/eval suite
    runs-on: ubuntu-latest
    # 15 min stopped fitting: the full suite (~8k tests) took 11.5 min on one
    # runner and blew 15 on another (2026-11-07), and a timeout reports as
    # "cancelled", which silently skips Build and Deploy.
    # Two complete passes took about21minutes including setup on2026-11-24.
    # Leave runner-variance headroom while retaining per-test timeouts.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24 # matches .nvmrc and the local dev node
          cache: npm

      # Six real PDF layout/hyphenation assertions require pdftotext. Missing
      # Poppler must fail setup in CI instead of silently skipping those checks.
      - name: Install the PDF regression reader
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v

      # Use `npm install` (not `npm ci`) on purpose — same as the Dockerfile.
      # Several deps ship a platform-specific WASM subtree (@emnapi/*) that is
      # NOT in the committed lock file (it resolves per-platform), so strict
      # `npm ci` fails on linux with "Missing @emnapi/runtime from lock file".
      # `npm install` reconciles that subtree at install time.
      - run: npm install --no-audit --no-fund

      # Scoped typecheck — app/lib/components/hooks only (tsconfig.ci.json).
      # This is the REAL gate: it covers only code that can actually reach
      # production, so a failure here is always deploy-relevant. It deliberately
      # excludes tests/**, which is exactly why the advisory step below exists.
      - run: npx tsc --noEmit -p tsconfig.ci.json

      # Advisory bare typecheck — the WHOLE repo, tests/** included.
      # NON-BLOCKING BY DESIGN (`continue-on-error: true`). Do NOT promote this
      # to a hard gate: build-deploy.yml triggers on `workflow_run` for this
      # workflow and only builds when `workflow_run.conclusion == 'success'`, so
      # anything that can fail the Test workflow silently blocks EVERY deploy and
      # stops prod from self-healing.
      # What it watches: type drift in tests/** — stale mocks, fixtures missing
      # newly-required fields. That drift is invisible to the scoped gate above
      # and had silently reached 25 errors before quick-260715-aa1 brought bare
      # `tsc --noEmit` to 0 (2026-07-15). Red here means drift to clean up, never
      # a blocked merge.
      - name: Bare typecheck (advisory, non-blocking)
        continue-on-error: true
        run: npx tsc --noEmit

      # Unit + eval suite. tests/integration is EXCLUDED (it needs live
      # Supabase → would break the secret-free gate; research Pitfall 6).
      # tests/eval is collected because 103-02 added tests/eval/**/*.test.ts to
      # the vitest `include` (otherwise this path would silently run zero tests).
      - if: ${{ github.event_name != 'workflow_dispatch' || github.ref_type != 'branch' || inputs.unit_scope != 'generation-credits' && inputs.unit_scope != 'qa-foundations' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
        run: npx vitest run tests/unit tests/eval

      # Determinism gate — the Wave-1 invariant made permanent. A re-emergent
      # cross-file isolation leak fails CI on this identical second pass.
      - if: ${{ github.event_name != 'workflow_dispatch' || github.ref_type != 'branch' || inputs.unit_scope != 'generation-credits' && inputs.unit_scope != 'qa-foundations' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
        run: npx vitest run tests/unit tests/eval
      - name: Characterize generation credit-read failures on a feature branch
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && inputs.unit_scope == 'generation-credits' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}
        run: npx vitest run tests/unit/services/generation-credit-read-failure.test.ts
      - name: Verify campaign fixes on a feature branch
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && inputs.unit_scope == 'qa-foundations' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}
        run: |
          npx vitest run tests/unit/components/dedicated-generation.test.tsx tests/unit/components/progress.test.tsx tests/unit/admin/pipeline-attempts-error-search.test.ts
          npm run qa:loader

  dependency-lock:
    name: Prepare a dependency lock candidate without credentials
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.unit_scope == 'dependency-lock' && github.repository == 'Skale-Club/xtimator' && github.ref_type == 'branch' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - name: Resolve the reviewed manifest and transitive proxy fix
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm update proxy-addr --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Assess the candidate without treating audit exit one as a pass
        run: |
          set +e
          npm audit --omit=dev --json > dependency-audit.json
          audit_status=$?
          set -e
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync("dependency-audit.json","utf8"));if(p.error||!p.metadata?.vulnerabilities)process.exit(2);console.log(JSON.stringify(p.metadata.vulnerabilities))'
          if [ "$audit_status" -gt 1 ]; then exit "$audit_status"; fi
      - name: Retain the unvalidated lock candidate for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-lock-${{ github.run_id }}
          path: |
            package.json
            package-lock.json
            dependency-audit.json
          retention-days: 7
          if-no-files-found: error

  build:
    name: Production compilation with development resources
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_build && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' || github.event_name == 'push' && github.ref == 'refs/heads/dev' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # No service-role, provider, deployment or production credentials. This
    # artifact is a compilation check, not the deployed release candidate.
    env:
      DATA_API_MODE: supabase
      NEXT_PUBLIC_AUTH_MODE: owned
      NEXT_PUBLIC_SUPABASE_URL: https://prmqgcrnpuvpzruyzvuv.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_DEV_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SITE_URL: https://qa-build.example.invalid
      APP_ORIGIN: https://qa-build.example.invalid
      GOOGLE_AUTH_PROJECT_ID: skaleclub
      FIREBASE_API_KEY: qa-no-external-auth
      FIREBASE_AUTH_DOMAIN: qa.invalid
      ACADEMY_FIXTURES: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: test -f .next/BUILD_ID

  acceptance:
    name: Isolated acceptance campaign
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.qa && !inputs.payment_sandbox && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' || github.event_name == 'push' && github.ref == 'refs/heads/dev' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    # Playwright1.59.1 disables native MediaRecorder in its Linux WebKit build.
    # Keep every browser journey on one runner with native WebKit recording.
    runs-on: macos-15-intel
    timeout-minutes: 90
    outputs:
      fixture_attempt: ${{ steps.campaign.outputs.attempt }}
    concurrency:
      group: xtimator-development-qa
      cancel-in-progress: false
    env:
      XTIMATOR_QA_DEV: '1'
      QA_MAX_FAILURES: ${{ inputs.qa_max_failures }}
      QA_SCENARIOS: ${{ inputs.qa_scenarios }}
      DATA_API_MODE: supabase
      NEXT_PUBLIC_AUTH_MODE: owned
      NEXT_PUBLIC_SUPABASE_URL: https://prmqgcrnpuvpzruyzvuv.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_DEV_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_DEV_SERVICE_ROLE_KEY }}
      XTIMATOR_DATA_JWT_SECRET: ${{ secrets.QA_DEV_DATA_JWT_SECRET }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Identify this acceptance attempt
        id: campaign
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Verify campaign infrastructure
        run: npm run qa:infrastructure
      - name: Verify browser fixture loading without browser startup
        run: npm run qa:loader
      - name: Retain the resolved dependency lock for review
        run: |
          mkdir -p qa-results
          cp package-lock.json qa-results/resolved-package-lock.json
      - run: npx playwright install --with-deps chromium webkit
      - name: Prepare isolated PDF reader and OpenSSL
        run: |
          python3 -m venv "$RUNNER_TEMP/xtimator-qa-python"
          "$RUNNER_TEMP/xtimator-qa-python/bin/python" -m pip install pypdf==6.0.0
          echo "QA_PYTHON=$RUNNER_TEMP/xtimator-qa-python/bin/python" >> "$GITHUB_ENV"
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Exercise required initial scenarios
        run: npm run qa:campaign -- --execution-only
      - name: Publish redacted synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-evidence-${{ github.run_id }}
          path: qa-results/
          retention-days: 7
          if-no-files-found: warn

  payment-sandbox:
    name: Stripe test-mode ledger readiness
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.payment_sandbox && github.repository == 'Skale-Club/xtimator' && github.ref_type == 'branch' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: xtimator-development-stripe-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - name: Install test dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for hosted Stripe Checkout
        if: ${{ inputs.payment_browser }}
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise Stripe test mode and the development ledger
        env:
          RUN_PAYMENT_SANDBOX: '1'
          RUN_PAYMENT_BROWSER: ${{ inputs.payment_browser && '1' || '0' }}
          NODE_ENV: test
          DATA_API_MODE: supabase
          NEXT_PUBLIC_AUTH_MODE: owned
          NEXT_PUBLIC_SUPABASE_URL: https://prmqgcrnpuvpzruyzvuv.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_DEV_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_DEV_SERVICE_ROLE_KEY }}
          QA_DEV_DATABASE_URL: ${{ secrets.QA_DEV_DATABASE_URL }}
          QA_STRIPE_TEST_KEY: ${{ secrets.QA_STRIPE_TEST_KEY }}
        run: ./node_modules/.bin/vitest run tests/integration/payment-sandbox-readiness.test.ts
      - name: Retain synthetic sandbox evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: payment-sandbox-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-results/payment-sandbox.json
          retention-days: 7
          if-no-files-found: warn

  cleanup:
    name: Recover synthetic acceptance fixtures
    needs: acceptance
    if: ${{ always() && needs.acceptance.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A cleanup-only rerun must retain the originating acceptance attempt.
    # Another attempt of this run can be active; its markers must not match.
    env:
      XTIMATOR_QA_DEV: '1'
      DATA_API_MODE: supabase
      NEXT_PUBLIC_AUTH_MODE: owned
      NEXT_PUBLIC_SUPABASE_URL: https://prmqgcrnpuvpzruyzvuv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QA_DEV_SERVICE_ROLE_KEY }}
      QA_CAMPAIGN_ATTEMPT: ${{ needs.acceptance.outputs.fixture_attempt }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - run: npm install --omit=dev --ignore-scripts --no-audit --no-fund
      - run: node scripts/qa/cleanup.mjs
