name: Build and Deploy

# Build the Docker image in CI, push it to GHCR, then ping Coolify to PULL it.
# The memory-heavy `next build` runs on GitHub-hosted runners and NEVER on the
# VPS — the on-VPS build OOM-thrashed the 8GB CX32 and froze Coolify + every
# app on the box. Coolify only ever pulls a prebuilt image now.
#
# ── Change these two lines when copying to another repo ──────────────────────
#   IMAGE_NAME   ghcr.io/skale-club/<app-name>  (must be lowercase)
#   APP_UUID     Coolify resource UUID (app Settings → UUID in the Coolify UI)
# ─────────────────────────────────────────────────────────────────────────────
#
# Required GitHub Actions Variables (Settings → Secrets and variables → Variables):
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
#   NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY, NEXT_PUBLIC_TURNSTILE_SITE_KEY
#   NEXT_PUBLIC_SENTRY_DSN   (public DSN — safe as a variable, gets inlined into the bundle)
#   SENTRY_ORG               Sentry organization slug
#   SENTRY_PROJECT           Sentry project name (xtimator)
#   (NEXT_PUBLIC_SITE_URL is hardcoded below — never a Variable, to avoid \n bugs)
#
# Required GitHub secrets (Settings → Secrets and variables → Secrets):
#   COOLIFY_TOKEN      Coolify API token (coolify.skale.club → Profile → API Tokens).
#                      One token, set once per repo. Skipped gracefully if absent.
#   SENTRY_AUTH_TOKEN  Sentry auth token for source map upload (build-time only).
#                      Get from: sentry.io → Settings → Auth Tokens → project:releases scope.
#                      Passed as a Docker build secret — never baked into the image.
# GHCR push uses the built-in GITHUB_TOKEN — no extra registry secret needed.
#
# Pre-launch audit fix: this used to trigger on `push: branches: [main]`
# directly — the SAME trigger as the Test workflow (.github/workflows/test.yml)
# — so both ran in PARALLEL with no dependency between them. A commit with a
# broken test suite (or a secret caught by gitleaks.yml) was built and deployed
# regardless of whether Test/gitleaks passed. Switched to `workflow_run` so
# this only fires AFTER the Test workflow finishes on main, gated on its
# conclusion via the job-level `if:` below.

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/skale-club/xtimator
  # Docker Image resource (rolling/zero-downtime deploys). The old compose
  # resource wucewun01rpf7z29qjmhhvbn had NO rolling-update support — every
  # deploy stopped the old container before starting the new one, taking
  # xtimator.com down for the whole pull+boot+healthcheck window.
  APP_UUID: cf1cqh0bq8jyw91e78tcw8c6
  COOLIFY_BASE: https://coolify.skale.club
  # Canonical site URL — hardcoded (NOT a Variable) so no stray newline/quote
  # can be reintroduced. The old Coolify value had a literal \n; do not repeat.
  SITE_URL: https://xtimator.com
  # workflow_run doesn't check out the triggering commit by default — pin the
  # exact SHA the Test workflow validated (falls back to github.sha for a
  # manual workflow_dispatch run, which has no workflow_run event).
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-and-push:
    name: Build image and push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Gate: skip entirely if the Test workflow run that triggered this did NOT
    # succeed. workflow_dispatch (no workflow_run event) always proceeds — that
    # is an explicit manual override, same as before.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          # env.IMAGE_NAME is already lowercase. GHCR requires a lowercase
          # repository path — template-reusers whose org/app names contain
          # capitals MUST lowercase IMAGE_NAME themselves (keep it lowercase).
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* are PUBLIC build args (inlined into the client bundle),
          # NOT secrets — they come from vars.* except SITE_URL (hardcoded above).
          build-args: |
            PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            PUBLIC_SUPABASE_ANON_VALUE=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            PUBLIC_SUPABASE_PUBLISHABLE_VALUE=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            PUBLIC_SITE_URL=${{ env.SITE_URL }}
            PUBLIC_TURNSTILE_SITE_VALUE=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            DEPLOYMENT_VERSION=${{ env.DEPLOY_SHA }}
          # SENTRY_AUTH_TOKEN is passed as a Docker build secret — never baked
          # into any image layer. Absent token silently skips source map upload.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Trigger Coolify deploy (pull prebuilt image)
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "${COOLIFY_TOKEN}" ]; then
            echo "::warning::COOLIFY_TOKEN not set — skipping Coolify trigger."
            echo "Image is built and pushed to GHCR. Set COOLIFY_TOKEN secret to auto-deploy."
            exit 0
          fi
          echo "Triggering Coolify pull for app ${APP_UUID}…"
          curl --fail-with-body -sS --retry 3 --retry-all-errors \
            "${COOLIFY_BASE}/api/v1/deploy?uuid=${APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"
          echo
          echo "Deploy queued. Coolify will pull ghcr.io/…:latest and restart."

      # ── Force an Inngest Cloud re-sync of the freshly-deployed serve endpoint ──
      # Adding a new Inngest function requires Inngest Cloud to re-sync the serve
      # URL (PUT /api/inngest). On 2026-06-03 a deploy landed whatsAppIntentRouterJob
      # WITHOUT that sync, so Cloud accepted events but never invoked ANY function —
      # every event-triggered job silently stopped in prod for days
      # (.planning/debug/whatsapp-inbound-no-reply-recurrence.md). This step makes
      # the re-sync an automatic, VISIBLE part of every deploy.
      #
      # Coolify does a rolling (zero-downtime) update: xtimator.com keeps answering
      # from the OLD container until the new one is healthy and traffic cuts over.
      # We must sync the NEW container — syncing the still-live old one would just
      # re-register the STALE function set and reproduce the exact 06-03 failure.
      # So we poll /api/health (which echoes GIT_SHA == this deploy's SHA) and only
      # PUT /api/inngest once the new container is confirmed serving. Up to 10
      # attempts, 30s apart, to cover the couple of minutes the rollout can take.
      # Never syncing (or a non-200 sync) fails the workflow so the gap is visible.
      - name: Force Inngest Cloud re-sync (post-deploy)
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -u
          # If there's no Coolify token the deploy step above skipped the actual
          # deploy (it exits 0 with a warning). No new container will come up, so
          # skip the sync rather than fail on a rollout that never happened.
          if [ -z "${COOLIFY_TOKEN:-}" ]; then
            echo "COOLIFY_TOKEN not set — deploy was skipped upstream; nothing to re-sync."
            exit 0
          fi
          base="${SITE_URL%/}"
          deploy_sha="${DEPLOY_SHA}"
          max_attempts=10
          attempt=1

          echo "Waiting for the new container (commit ${deploy_sha}) to serve traffic, then syncing Inngest…"

          while [ $attempt -le $max_attempts ]; do
            # /api/health returns compact JSON incl. "commit":"<GIT_SHA>". Only
            # proceed once that commit matches THIS deploy — i.e. after cutover.
            health_body=$(curl --silent --max-time 15 "${base}/api/health" || true)

            if printf '%s' "${health_body}" | grep -q "\"commit\":\"${deploy_sha}\""; then
              http_code=$(curl --silent --show-error --output /tmp/inngest_sync \
                --write-out "%{http_code}" --max-time 30 \
                -X PUT "${base}/api/inngest" || echo "000")

              if [ "${http_code}" = "200" ]; then
                echo "[inngest-sync] OK (HTTP 200) on attempt ${attempt} — functions re-synced for commit ${deploy_sha}."
                exit 0
              fi

              echo "[inngest-sync] new container is live but PUT /api/inngest returned HTTP ${http_code} (attempt ${attempt}/${max_attempts})."
            else
              echo "[inngest-sync] waiting for rolling cutover — /api/health not yet serving commit ${deploy_sha} (attempt ${attempt}/${max_attempts})."
            fi

            attempt=$((attempt + 1))
            if [ $attempt -le $max_attempts ]; then
              sleep 30
            fi
          done

          echo "::error::[inngest-sync] Could not re-sync Inngest Cloud after ${max_attempts} attempts — either the new container (commit ${deploy_sha}) never became live or PUT /api/inngest never returned 200. New/changed Inngest functions may be unregistered, silently stopping every event-triggered job. See .planning/debug/whatsapp-inbound-no-reply-recurrence.md."
          if [ -s /tmp/inngest_sync ]; then
            echo "::group::[inngest-sync] last PUT /api/inngest response body"
            head -c 2048 /tmp/inngest_sync
            echo ""
            echo "::endgroup::"
          fi
          exit 1
